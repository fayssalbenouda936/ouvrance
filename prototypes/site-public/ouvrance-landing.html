<title>Trois voix d'ouvrance</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<!--
  PROTOTYPE — jetable. Ticket #7 « Le site public et son pouvoir de conversion ».
  TOUR 2. Le tour 1 a tranché la STRUCTURE : entonnoir vertical plein écran, sans
  en-tête, prix au dernier panneau (maquette « La bobine »). Restaient deux refus :
  l'identité empruntée au musée, et une écriture centrée sur le virement.
  Ici la structure est donc TENUE CONSTANTE — c'est l'axe déjà décidé — et on ne fait
  varier que ce qui reste ouvert : l'identité de marque et la voix.
  A1 L'atelier · A2 La console · A3 L'écrin — commutables via ?variant=A1|A2|A3.
  Les trois posent la même thèse produit : le produit est un JEU PERSONNALISABLE,
  le musée n'est qu'un décor parmi d'autres, le lien de virement est une option de fin.
  Ne pas promouvoir ce code en production : aucune abstraction, aucun test.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=IBM+Plex+Mono:wght@400;600&family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;700&display=swap">
<style>
/* ============================== BANC D'ESSAI ============================== */
:root{
  --bench-ground:#0B0A0C; --bench-panel:#141219; --bench-line:#2C2734;
  --bench-ink:#EDE9F2; --bench-ink-2:#A79FB8; --bench-ink-3:#6E6782; --bench-accent:#4FD6C0;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --ui:'Inter',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bench-ground); color:var(--bench-ink); font-family:var(--ui); font-size:15px; line-height:1.55; -webkit-font-smoothing:antialiased}
.bench{min-height:100vh; display:grid; gap:30px; grid-template-columns:minmax(0,1fr) 400px; padding:28px 28px 190px}
@media (max-width:1040px){ .bench{grid-template-columns:minmax(0,1fr); padding:18px 16px 210px} }
.stage{display:flex; flex-direction:column; align-items:center; gap:16px; min-width:0}
.eyebrow{font-family:var(--mono); text-transform:uppercase; letter-spacing:.14em; font-size:11.5px; color:var(--bench-ink-3); text-align:center}
.eyebrow b{color:var(--bench-accent); font-weight:600}
.phone{
  position:relative; width:390px; max-width:100%; --sh:min(844px,74vh); height:var(--sh);
  border-radius:44px; padding:10px; background:linear-gradient(160deg,#2A2731,#0E0D11);
  box-shadow:0 50px 100px -34px #000, 0 0 0 1px #322D3C inset; flex:none;
}
.screen{position:relative; width:100%; height:100%; border-radius:35px; overflow:hidden; background:#000; overflow-y:auto; scrollbar-width:none; scroll-snap-type:y proximity}
.screen::-webkit-scrollbar{display:none}
.notch{position:absolute; top:14px; left:50%; transform:translateX(-50%); width:112px; height:26px; border-radius:14px; background:#08070A; z-index:60; pointer-events:none}
.caption{font-family:var(--mono); font-size:11.5px; color:var(--bench-ink-3); text-align:center; max-width:62ch}
.notes{display:flex; flex-direction:column; gap:14px; min-width:0}
.card{background:var(--bench-panel); border:1px solid var(--bench-line); border-radius:16px; padding:18px 20px}
.card.flag{border-color:#5A4522; background:#191308}
.card h2{margin:0 0 10px; font-family:var(--mono); font-size:12px; font-weight:600; text-transform:uppercase; letter-spacing:.14em; color:var(--bench-accent)}
.card.flag h2{color:#E8B76A}
.card h3{margin:14px 0 4px; font-size:13px; font-weight:600; color:var(--bench-ink)}
.card h3:first-of-type{margin-top:0}
.card p{margin:0 0 8px; font-size:13.5px; color:var(--bench-ink-2)}
.card p:last-child{margin-bottom:0}
.card ul{margin:0; padding-left:17px; font-size:13.5px; color:var(--bench-ink-2)}
.card li{margin-bottom:6px}
.card li:last-child{margin-bottom:0}
.card b{color:var(--bench-ink); font-weight:600}
.card .warn{color:#E8B76A}
.swatches{display:flex; gap:6px; margin-top:10px; flex-wrap:wrap}
.sw{width:30px; height:30px; border-radius:8px; border:1px solid #ffffff1a}
.switcher{
  position:fixed; left:50%; bottom:26px; transform:translateX(-50%); z-index:200;
  display:flex; align-items:center; gap:4px; padding:6px; background:#F4F1F8; color:#14121A;
  border-radius:999px; box-shadow:0 24px 60px -18px #000, 0 0 0 1px #ffffff30;
}
.switcher button{width:44px; height:44px; border:0; border-radius:999px; background:transparent; color:#14121A; cursor:pointer; display:grid; place-items:center; transition:background .18s ease}
.switcher button:hover{background:#00000012}
.switcher button:focus-visible{outline:2px solid #4FD6C0; outline-offset:2px}
.switcher .label{min-width:250px; text-align:center; padding:0 10px; font-family:var(--ui); font-size:15px; font-weight:600; line-height:1.2}
.switcher .label span{display:block; font-family:var(--mono); font-size:10.5px; letter-spacing:.04em; color:#6A6478; font-weight:400}
@media (max-width:1040px){ .switcher{bottom:16px} }

/* ====================================================================== */
/* SQUELETTE COMMUN — l'entonnoir. Décidé au tour 1, tenu constant ici.    */
/* ====================================================================== */
.funnel{font-family:var(--body); color:var(--ink); background:var(--ground)}
.funnel .pan{
  position:relative; min-height:calc(var(--sh) - 20px); scroll-snap-align:start;
  display:flex; flex-direction:column; justify-content:flex-end; padding:0 22px 112px; overflow:hidden;
}
.funnel .scene{position:absolute; inset:0; z-index:0}
.funnel .scene svg{width:100%; height:100%; display:block}
.funnel .veil{position:absolute; inset:0; z-index:1; background:linear-gradient(180deg,var(--ground) 0%,transparent 13%,transparent 26%,var(--ground) 49%,var(--ground) 100%)}
.funnel .pan > *:not(.scene):not(.veil):not(.mark):not(.hint){position:relative; z-index:2}
.funnel .mark{
  position:absolute; top:58px; left:22px; z-index:20; font-family:var(--display);
  font-size:var(--mark-size,16px); font-weight:var(--mark-weight,700);
  letter-spacing:var(--mark-track,.02em); text-transform:var(--mark-case,none); color:var(--ink);
}
.funnel .kicker{font-family:var(--mono); text-transform:uppercase; letter-spacing:.2em; font-size:10.5px; color:var(--accent); margin-bottom:12px}
.funnel h1{margin:0 0 14px; font-family:var(--display); font-weight:var(--h1-weight,700); font-size:var(--h1-size,44px); line-height:var(--h1-lh,1); letter-spacing:var(--h1-track,-.02em); text-transform:var(--h1-case,none)}
.funnel h1 em{font-style:var(--em-style,normal); color:var(--accent); display:block}
.funnel .lede{margin:0 0 20px; font-size:15.5px; line-height:1.5; color:var(--ink-2); max-width:31ch}
.funnel .cta{
  display:flex; align-items:center; justify-content:center; gap:9px; min-height:56px;
  border-radius:var(--radius,999px); background:var(--accent); color:var(--on-accent);
  text-decoration:none; font-weight:700; font-size:16.5px; box-shadow:0 16px 40px -16px var(--accent);
}
.funnel .micro{margin:11px 0 0; font-size:12.5px; color:var(--ink-2); text-align:center; display:flex; align-items:center; justify-content:center; gap:6px}
.funnel .micro svg{flex:none}
.funnel .hint{position:absolute; left:50%; bottom:24px; transform:translateX(-50%); z-index:3; display:flex; flex-direction:column; align-items:center; gap:4px; font-family:var(--mono); font-size:9.5px; letter-spacing:.16em; color:var(--ink-3); text-transform:uppercase}

/* les trois traces — ce que l'offrant met dedans */
.funnel .traces{display:flex; flex-direction:column; gap:12px; margin-bottom:20px}
.funnel .trace{display:flex; gap:14px; align-items:flex-start; padding:15px; border-radius:var(--radius-sm,16px); background:var(--surface); border:1px solid var(--line)}
.funnel .trace .ico{flex:none; width:38px; height:38px; border-radius:var(--radius-sm,12px); background:var(--accent-soft); color:var(--accent); display:grid; place-items:center}
.funnel .trace .ico svg{width:20px; height:20px}
.funnel .trace b{display:block; font-size:15px; margin-bottom:3px; font-weight:600}
.funnel .trace span{display:block; font-size:13px; color:var(--ink-2); line-height:1.45}

/* le catalogue — le musée n'est qu'un décor parmi d'autres */
.funnel .deck{display:flex; gap:11px; overflow-x:auto; margin:0 -22px 16px; padding:2px 22px 8px; scrollbar-width:none}
.funnel .deck::-webkit-scrollbar{display:none}
.funnel .tile{flex:none; width:146px}
.funnel .tile .art{width:146px; height:196px; border-radius:var(--radius-sm,16px); overflow:hidden; background:var(--surface); border:1px solid var(--line)}
.funnel .tile .art svg{width:100%; height:100%; display:block}
.funnel .tile b{display:block; margin-top:10px; font-size:14px; font-weight:600}
.funnel .tile span{display:block; font-family:var(--mono); font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-3); margin-top:2px}
.funnel .tile.soon b, .funnel .tile.soon span{opacity:.55}

/* les prix */
.funnel .offer{border:1px solid var(--line); border-radius:var(--radius-sm,18px); padding:17px; background:var(--surface); margin-bottom:11px}
.funnel .offer.lead{border-color:var(--accent); background:var(--accent-soft)}
.funnel .offer .tag{font-family:var(--mono); font-size:9.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--on-accent); background:var(--accent); padding:3px 8px; border-radius:5px; display:inline-block; margin-bottom:10px}
.funnel .offer .row{display:flex; align-items:baseline; justify-content:space-between; gap:10px}
.funnel .offer h3{margin:0; font-family:var(--display); font-size:var(--h3-size,23px); font-weight:var(--h1-weight,700); letter-spacing:var(--h1-track,-.01em); text-transform:var(--h1-case,none)}
.funnel .offer .price{font-family:var(--display); font-size:var(--h3-size,23px); font-weight:var(--h1-weight,700); color:var(--accent); white-space:nowrap}
.funnel .offer p{margin:7px 0 0; font-size:13.5px; color:var(--ink-2); line-height:1.5}
.funnel .bar{
  position:sticky; bottom:0; z-index:30; padding:12px 18px calc(12px + env(safe-area-inset-bottom));
  background:color-mix(in srgb, var(--ground) 94%, transparent); backdrop-filter:blur(14px);
  border-top:1px solid var(--line); display:flex; align-items:center; gap:12px;
}
.funnel .bar .txt{flex:1; min-width:0}
.funnel .bar b{display:block; font-size:13.5px}
.funnel .bar span{display:block; font-size:11.5px; color:var(--ink-2)}
.funnel .bar a{flex:none; min-height:46px; padding:0 20px; border-radius:var(--radius,999px); background:var(--accent); color:var(--on-accent); display:grid; place-items:center; text-decoration:none; font-weight:700; font-size:14.5px}
@media (prefers-reduced-motion:reduce){ *{animation:none !important; transition:none !important} }

/* ====================================================================== */
/* A1 — L'ATELIER : la marque est une maison qui fabrique                 */
/* ====================================================================== */
.vA1{
  --ground:#14100E; --surface:#1D1815; --line:#2E2622;
  --ink:#F7F1EA; --ink-2:#A99A8E; --ink-3:#6E625A;
  --accent:#E4573D; --accent-soft:#2A1712; --on-accent:#1A0703;
  --display:'Bricolage Grotesque',system-ui,sans-serif; --body:'Inter',system-ui,sans-serif;
  --h1-size:44px; --h1-weight:800; --h1-lh:1.02; --h1-track:-.03em;
  --h3-size:23px; --radius:999px; --radius-sm:16px;
  --mark-size:18px; --mark-weight:800; --mark-track:-.02em;
}

/* ====================================================================== */
/* A2 — LA CONSOLE : la marque est un label de jeux                       */
/* ====================================================================== */
.vA2{
  --ground:#08090C; --surface:#101319; --line:#1E2430;
  --ink:#EDF1F7; --ink-2:#8A93A6; --ink-3:#5A6376;
  --accent:#B4F461; --accent-soft:#151D0E; --on-accent:#0B1203;
  --display:'Space Grotesk',system-ui,sans-serif; --body:'Space Grotesk',system-ui,sans-serif;
  --h1-size:41px; --h1-weight:700; --h1-lh:1.04; --h1-track:-.035em;
  --h3-size:21px; --radius:12px; --radius-sm:12px;
  --mark-size:15px; --mark-weight:700; --mark-track:.12em; --mark-case:uppercase;
}

/* ====================================================================== */
/* A3 — L'ÉCRIN : la marque est une maison de cadeaux                     */
/* ====================================================================== */
.vA3{
  --ground:#17121A; --surface:#211A25; --line:#332A38;
  --ink:#F6EFF3; --ink-2:#B0A0AC; --ink-3:#786A76;
  --accent:#F0C3B8; --accent-soft:#2B1F22; --on-accent:#2A1310;
  --display:'Instrument Serif',Georgia,serif; --body:'Inter',system-ui,sans-serif;
  --h1-size:50px; --h1-weight:400; --h1-lh:1.02; --h1-track:-.015em; --em-style:italic;
  --h3-size:27px; --radius:999px; --radius-sm:18px;
  --mark-size:22px; --mark-weight:400; --mark-track:.01em;
}
</style>

<div class="bench">
  <div class="stage">
    <div class="eyebrow" id="eyebrow"></div>
    <div class="phone"><div class="notch"></div><div class="screen" id="screen"></div></div>
    <div class="caption" id="caption"></div>
  </div>
  <aside class="notes" id="notes"></aside>
</div>

<nav class="switcher" aria-label="Commutateur de maquette">
  <button id="prev" aria-label="Maquette précédente">
    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
  </button>
  <div class="label" id="label"></div>
  <button id="next" aria-label="Maquette suivante">
    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
  </button>
</nav>

<script>
/* ---------------------------------------------------------------------- */

/* la marque encadre les fictions, elle ne les porte pas.                  */
/* ---------------------------------------------------------------------- */

const lueur = (o) => `

  <defs><radialGradient id="lg${o}" cx="${o}" cy=".3" r=".7">

const artBraquage = `
<svg viewBox="0 0 146 196" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Le braquage du musée">
  <defs><radialGradient id="abH" cx=".5" cy=".45" r=".55">

const artLettre = `
<svg viewBox="0 0 146 196" preserveAspectRatio="xMidYMid slice" role="img" aria-label="La lettre cachetée">
  <rect width="146" height="196" fill="#F3EADC"/>
  <g transform="translate(19 56)">
    <rect x="-3" y="7" width="112" height="82" rx="5" fill="#E0CDB0"/>

</svg>`;

const artBientot = `

  <rect width="146" height="196" fill="var(--surface)"/>

  <g transform="translate(73 92)" stroke="var(--ink-3)" stroke-width="2" fill="none" stroke-linecap="round">
    <rect x="-13" y="-4" width="26" height="20" rx="4"/><path d="M-7 -4v-6a7 7 0 0 1 14 0v6"/>
  </g>
  <rect x="49" y="128" width="48" height="4" rx="2" fill="var(--line)"/>
</svg>`;

const ic = {
  arrow:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',

const cles = Object.keys(VARIANTS);
const screen = document.getElementById('screen');
const label = document.getElementById('label');
const eyebrow = document.getElementById('eyebrow');
const caption = document.getElementById('caption');
const notes = document.getElementById('notes');

function courante(){
  const v = new URLSearchParams(location.search).get('variant');
  return cles.includes(v) ? v : cles[0];
}

function rendre(){
  const k = courante();
  const v = VARIANTS[k];
  screen.scrollTop = 0;
  screen.innerHTML = funnel(v.cls, MOTS[k]);
  label.innerHTML = `${k} — ${v.nom}<span>${v.sous}</span>`;
  eyebrow.innerHTML = `Ticket #7 · tour 2 · structure tenue constante · identité et voix <b>${k}</b>`;
  caption.textContent = v.legende;
  notes.innerHTML = v.notes;
  const bar = document.getElementById('bar');
  bar.style.transform = 'translateY(120%)';
  bar.style.transition = 'transform .28s ease';
  screen.onscroll = () => { bar.style.transform = screen.scrollTop > 240 ? 'translateY(0)' : 'translateY(120%)'; };
}

function aller(pas){
  const i = cles.indexOf(courante());
  const k = cles[(i + pas + cles.length) % cles.length];
  const u = new URL(location.href);
  u.searchParams.set('variant', k);
  history.replaceState(null, '', u);
  rendre();
}

document.getElementById('prev').addEventListener('click', () => aller(-1));
document.getElementById('next').addEventListener('click', () => aller(1));
document.addEventListener('keydown', e => {
  const t = e.target;
  if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;
  if (e.key === 'ArrowLeft') aller(-1);
  if (e.key === 'ArrowRight') aller(1);
});

rendre();

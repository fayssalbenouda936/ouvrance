<title>Trois ouvrance.fr</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<!--
  PROTOTYPE — jetable. Ticket #7 « Le site public et son pouvoir de conversion ».
  Trois structures radicalement différentes de la page d'atterrissage post-TikTok,
  commutables via ?variant=A|B|C. Mobile d'abord : tout est rendu dans un cadre 390x844.
  A — La bobine (la vidéo continue)   B — La maison (vitrine premium)   C — Le seuil (configurateur)
  Ne pas promouvoir ce code en production : aucune abstraction, aucun test.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Calistoga&family=Cormorant:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&family=Montserrat:wght@300;400;500;600;700&display=swap">
<style>
/* ============================== BANC D'ESSAI ============================== */
:root{
  --bench-ground:#0B0A0C; --bench-panel:#141219; --bench-panel-2:#1B1823; --bench-line:#2C2734;
  --bench-ink:#EDE9F2; --bench-ink-2:#A79FB8; --bench-ink-3:#6E6782; --bench-accent:#4FD6C0;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --ui:'Inter',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bench-ground); color:var(--bench-ink);
  font-family:var(--ui); font-size:15px; line-height:1.55; -webkit-font-smoothing:antialiased;
}
.bench{
  min-height:100vh; display:grid; gap:30px;
  grid-template-columns:minmax(0,1fr) 400px;
  padding:28px 28px 190px;
}
@media (max-width:1040px){ .bench{grid-template-columns:minmax(0,1fr); padding:18px 16px 210px} }

.stage{display:flex; flex-direction:column; align-items:center; gap:16px; min-width:0}
.eyebrow{
  font-family:'Barlow Condensed',sans-serif; text-transform:uppercase; letter-spacing:.16em;
  font-size:14px; font-weight:600; color:var(--bench-ink-3); text-align:center;
}
.eyebrow b{color:var(--bench-accent); font-weight:600}

/* --- le téléphone --- */
.phone{
  position:relative; width:390px; max-width:100%;
  --sh:min(844px,74vh); height:var(--sh); border-radius:44px; padding:10px;
  background:linear-gradient(160deg,#2A2731,#0E0D11);
  box-shadow:0 50px 100px -34px #000, 0 0 0 1px #322D3C inset;
  flex:none;
}
.screen{
  position:relative; width:100%; height:100%; border-radius:35px; overflow:hidden;
  background:#000; overflow-y:auto; scrollbar-width:none; -webkit-overflow-scrolling:touch;
}
.screen::-webkit-scrollbar{display:none}
.notch{
  position:absolute; top:14px; left:50%; transform:translateX(-50%);
  width:112px; height:26px; border-radius:14px; background:#08070A; z-index:60; pointer-events:none;
}
.caption{
  font-family:var(--mono); font-size:11.5px; color:var(--bench-ink-3);
  letter-spacing:.02em; text-align:center; max-width:62ch;
}

/* --- le panneau de notes --- */
.notes{display:flex; flex-direction:column; gap:14px; min-width:0}
.card{background:var(--bench-panel); border:1px solid var(--bench-line); border-radius:16px; padding:18px 20px}
.card h2{
  margin:0 0 10px; font-family:'Barlow Condensed',sans-serif; font-size:15px; font-weight:600;
  text-transform:uppercase; letter-spacing:.14em; color:var(--bench-accent);
}
.card h3{margin:14px 0 4px; font-size:13px; font-weight:600; color:var(--bench-ink)}
.card h3:first-of-type{margin-top:0}
.card p{margin:0 0 8px; font-size:13.5px; color:var(--bench-ink-2)}
.card p:last-child{margin-bottom:0}
.card ul{margin:0; padding-left:17px; font-size:13.5px; color:var(--bench-ink-2)}
.card li{margin-bottom:6px}
.card li:last-child{margin-bottom:0}
.card b{color:var(--bench-ink); font-weight:600}
.card .warn{color:#E8B76A}
.swatches{display:flex; gap:6px; margin-top:10px; flex-wrap:wrap}
.sw{width:30px; height:30px; border-radius:8px; border:1px solid #ffffff1a}
.meta{font-family:var(--mono); font-size:11px; color:var(--bench-ink-3); letter-spacing:.03em}

/* --- la barre de commutation --- */
.switcher{
  position:fixed; left:50%; bottom:26px; transform:translateX(-50%); z-index:200;
  display:flex; align-items:center; gap:4px; padding:6px;
  background:#F4F1F8; color:#14121A; border-radius:999px;
  box-shadow:0 24px 60px -18px #000, 0 0 0 1px #ffffff30;
}
.switcher button{
  width:44px; height:44px; border:0; border-radius:999px; background:transparent; color:#14121A;
  cursor:pointer; display:grid; place-items:center; transition:background .18s ease;
}
.switcher button:hover{background:#00000012}
.switcher button:focus-visible{outline:2px solid #4FD6C0; outline-offset:2px}
.switcher .label{
  min-width:236px; text-align:center; padding:0 10px;
  font-family:'Barlow Condensed',sans-serif; text-transform:uppercase; letter-spacing:.1em;
  font-size:15px; font-weight:600; line-height:1.15;
}
.switcher .label span{display:block; font-family:var(--mono); font-size:10.5px; letter-spacing:.06em; color:#6A6478; text-transform:none}
@media (max-width:1040px){ .switcher{bottom:16px} }

/* ====================================================================== */
/* ============ A — LA BOBINE : la vidéo TikTok ne s'arrête pas ========== */
/* ====================================================================== */
.vA{
  --ground:#0A0908; --ink:#F5F0E8; --ink-2:#A79E92; --gold:#E8B76A; --turq:#4FD6C0;
  font-family:'Inter',system-ui,sans-serif; color:var(--ink); background:var(--ground);
}
.screen:has(.vA){scroll-snap-type:y proximity}
.vA .pan{
  position:relative; min-height:calc(var(--sh) - 20px); scroll-snap-align:start;
  display:flex; flex-direction:column; justify-content:flex-end;
  padding:0 22px 118px; overflow:hidden;
}
.vA .wordmark{
  position:absolute; top:58px; left:22px; z-index:20;
  font-family:'Barlow Condensed',sans-serif; text-transform:uppercase; letter-spacing:.34em;
  font-size:12px; font-weight:600; color:#FFFFFFB0;
}
.vA .scene{position:absolute; inset:0; z-index:0}
.vA .scene svg{width:100%; height:100%; display:block}
.vA .veil{
  position:absolute; inset:0; z-index:1;
  background:linear-gradient(180deg,#0A0908E6 0%,#0A090833 26%,#0A090800 44%,#0A0908D9 76%,#0A0908 100%);
}
.vA .pan > *:not(.scene):not(.veil):not(.wordmark):not(.hint){position:relative; z-index:2}
.vA h1{
  margin:0 0 14px; font-family:'Barlow Condensed',sans-serif; font-weight:700;
  font-size:46px; line-height:.95; letter-spacing:-.01em; text-transform:uppercase;
}
.vA h1 em{font-style:normal; color:var(--gold); display:block}
.vA .kicker{
  font-family:'Barlow Condensed',sans-serif; text-transform:uppercase; letter-spacing:.22em;
  font-size:11.5px; font-weight:600; color:var(--turq); margin-bottom:12px;
}
.vA p{margin:0 0 18px; font-size:15px; line-height:1.5; color:var(--ink-2); max-width:30ch}
.vA .cta{
  display:flex; align-items:center; justify-content:center; gap:9px; min-height:56px;
  border-radius:999px; background:var(--gold); color:#1A1206; text-decoration:none;
  font-weight:700; font-size:16.5px; letter-spacing:.01em;
  box-shadow:0 16px 40px -14px #E8B76A80;
}
.vA .micro{
  margin:10px 0 0; font-size:12.5px; color:#A79E92; text-align:center;
  display:flex; align-items:center; justify-content:center; gap:6px;
}
.vA .hint{
  position:absolute; left:50%; bottom:26px; transform:translateX(-50%); z-index:3;
  display:flex; flex-direction:column; align-items:center; gap:5px;
  font-family:var(--mono); font-size:10px; letter-spacing:.14em; color:#6E675D; text-transform:uppercase;
}
.vA .beats{display:flex; gap:11px; overflow-x:auto; padding-bottom:6px; margin:0 -22px 20px; padding-left:22px; padding-right:22px; scrollbar-width:none}
.vA .beats::-webkit-scrollbar{display:none}
.vA .beat{flex:none; width:132px}
.vA .beat .thumb{width:132px; height:198px; border-radius:14px; overflow:hidden; background:#131110; border:1px solid #2A2520}
.vA .beat .thumb svg{width:100%; height:100%; display:block}
.vA .beat b{display:block; margin-top:9px; font-size:13px; font-weight:600}
.vA .beat span{display:block; font-size:12px; color:var(--ink-2); line-height:1.4}
.vA .steps{list-style:none; margin:0 0 22px; padding:0; display:flex; flex-direction:column; gap:14px}
.vA .steps li{display:flex; gap:13px; align-items:flex-start}
.vA .steps .n{
  flex:none; width:26px; height:26px; border-radius:999px; border:1px solid #3A342C;
  display:grid; place-items:center; font-family:var(--mono); font-size:11px; color:var(--gold);
}
.vA .steps b{display:block; font-size:14.5px}
.vA .steps span{font-size:13px; color:var(--ink-2)}
.vA .offer{border:1px solid #2A2520; border-radius:18px; padding:18px; background:#100E0D; margin-bottom:12px}
.vA .offer.hero{border-color:#5A4522; background:linear-gradient(170deg,#1A1408,#100E0D)}
.vA .offer .tag{
  font-family:var(--mono); font-size:10px; letter-spacing:.14em; text-transform:uppercase;
  color:#1A1206; background:var(--gold); padding:3px 8px; border-radius:5px; display:inline-block; margin-bottom:11px;
}
.vA .offer h3{margin:0 0 4px; font-family:'Barlow Condensed',sans-serif; font-size:27px; text-transform:uppercase; letter-spacing:.01em}
.vA .offer .price{font-family:'Barlow Condensed',sans-serif; font-size:27px; color:var(--gold)}
.vA .offer p{margin:6px 0 0; font-size:13.5px; max-width:none}
.vA .bar{
  position:sticky; bottom:0; z-index:30; padding:12px 18px calc(12px + env(safe-area-inset-bottom));
  background:#0A0908F2; backdrop-filter:blur(14px); border-top:1px solid #221E1A;
  display:flex; align-items:center; gap:12px;
}
.vA .bar .txt{flex:1; min-width:0}
.vA .bar b{display:block; font-size:13.5px}
.vA .bar span{display:block; font-size:11.5px; color:var(--ink-2)}
.vA .bar a{
  flex:none; min-height:46px; padding:0 20px; border-radius:999px; background:var(--gold); color:#1A1206;
  display:grid; place-items:center; text-decoration:none; font-weight:700; font-size:14.5px;
}

/* ====================================================================== */
/* ================ B — LA MAISON : la vitrine premium ================== */
/* ====================================================================== */
.vB{
  --paper:#FAF8F5; --ink:#0C0A09; --ink-2:#5A534C; --line:#E4DED6; --gold:#8A6A1F; --deep:#141110;
  font-family:'Montserrat',system-ui,sans-serif; color:var(--ink); background:var(--paper);
}
.vB header{
  position:sticky; top:0; z-index:40; display:flex; align-items:center; justify-content:space-between;
  padding:calc(env(safe-area-inset-top) + 52px) 20px 14px;
  background:#FAF8F5F2; backdrop-filter:blur(12px); border-bottom:1px solid var(--line);
}
.vB .wordmark{font-family:'Cormorant',serif; font-size:23px; font-weight:600; letter-spacing:.02em}
.vB header a{
  min-height:38px; padding:0 16px; border-radius:999px; background:var(--ink); color:#fff;
  display:grid; place-items:center; text-decoration:none; font-size:13px; font-weight:600;
}
.vB section{padding:44px 20px; border-bottom:1px solid var(--line)}
.vB .hero{padding-top:34px; text-align:center}
.vB .eye{
  font-size:11px; font-weight:600; letter-spacing:.2em; text-transform:uppercase; color:var(--gold); margin-bottom:14px;
}
.vB h1{
  margin:0 0 16px; font-family:'Cormorant',serif; font-weight:500;
  font-size:44px; line-height:1.04; letter-spacing:-.01em;
}
.vB h1 em{font-style:italic; color:var(--gold)}
.vB .lede{margin:0 auto 24px; font-size:15.5px; line-height:1.6; color:var(--ink-2); max-width:32ch}
.vB .btns{display:flex; flex-direction:column; gap:10px}
.vB .btn{
  min-height:52px; border-radius:999px; display:grid; place-items:center; text-decoration:none;
  font-size:15.5px; font-weight:600;
}
.vB .btn.p{background:var(--ink); color:#fff}
.vB .btn.s{background:transparent; color:var(--ink); border:1px solid #C9C1B6}
.vB .shot{
  margin:30px -20px 0; height:300px; background:var(--deep); position:relative; overflow:hidden;
}
.vB .shot svg{width:100%; height:100%; display:block}
.vB h2{
  margin:0 0 8px; font-family:'Cormorant',serif; font-weight:500; font-size:33px; line-height:1.1;
}
.vB .sub{margin:0 0 26px; font-size:14.5px; color:var(--ink-2); line-height:1.6}
.vB .obj{border:1px solid var(--line); border-radius:20px; overflow:hidden; background:#fff; margin-bottom:16px}
.vB .obj .top{height:186px; position:relative; overflow:hidden}
.vB .obj .top svg{width:100%; height:100%; display:block}
.vB .obj .body{padding:20px}
.vB .obj .nature{
  font-size:10.5px; font-weight:700; letter-spacing:.18em; text-transform:uppercase; color:var(--gold); margin-bottom:9px;
}
.vB .obj h3{margin:0 0 8px; font-family:'Cormorant',serif; font-weight:600; font-size:27px}
.vB .obj p{margin:0 0 14px; font-size:14px; color:var(--ink-2); line-height:1.6}
.vB .obj .row{display:flex; align-items:center; justify-content:space-between; gap:12px}
.vB .obj .price{font-family:'Cormorant',serif; font-size:26px; font-weight:600}
.vB .obj .price small{display:block; font-family:'Montserrat',sans-serif; font-size:11px; font-weight:500; color:var(--ink-2)}
.vB .obj .pick{
  min-height:44px; padding:0 20px; border-radius:999px; background:var(--ink); color:#fff;
  display:grid; place-items:center; text-decoration:none; font-size:14px; font-weight:600;
}
.vB .how{list-style:none; margin:0; padding:0; counter-reset:s}
.vB .how li{display:flex; gap:15px; padding:16px 0; border-bottom:1px solid var(--line)}
.vB .how li:last-child{border-bottom:0; padding-bottom:0}
.vB .how .n{
  flex:none; width:32px; height:32px; border-radius:999px; border:1px solid var(--line);
  display:grid; place-items:center; font-family:'Cormorant',serif; font-size:17px; font-weight:600; color:var(--gold);
}
.vB .how b{display:block; font-size:15px; margin-bottom:3px}
.vB .how span{font-size:13.5px; color:var(--ink-2); line-height:1.55}
.vB .trust{background:var(--deep); color:#F2EEE8; border-bottom:0}
.vB .trust h2{color:#F2EEE8}
.vB .trust .sub{color:#A79E92; margin-bottom:0}
.vB .chips{display:flex; flex-wrap:wrap; gap:8px}
.vB .chip{
  padding:9px 15px; border-radius:999px; border:1px solid var(--line); background:#fff;
  font-size:13.5px; min-height:40px; display:inline-flex; align-items:center;
}
.vB .faq{border-bottom:1px solid var(--line); padding:15px 0}
.vB .faq b{display:block; font-size:14.5px; margin-bottom:5px}
.vB .faq span{font-size:13.5px; color:var(--ink-2); line-height:1.6}
.vB footer{padding:30px 20px calc(34px + env(safe-area-inset-bottom)); background:#F2EEE8}
.vB footer .links{display:flex; flex-wrap:wrap; gap:14px; margin-bottom:16px}
.vB footer a{font-size:12.5px; color:var(--ink-2); text-decoration:none; border-bottom:1px solid #C9C1B6; padding-bottom:2px}
.vB footer p{margin:0; font-size:11.5px; color:#8A837B}

/* ====================================================================== */
/* ============== C — LE SEUIL : on entre par la question =============== */
/* ====================================================================== */
.vC{
  --cream:#FDF8F3; --ink:#241A22; --ink-2:#6E5E68; --line:#EADFD6;
  --plum:#4A2340; --terra:#C4643C; --terra-soft:#FBEDE6;
  font-family:'Inter',system-ui,sans-serif; color:var(--ink); background:var(--cream);
}
.vC .top{
  position:sticky; top:0; z-index:40; padding:calc(env(safe-area-inset-top) + 50px) 20px 12px;
  background:#FDF8F3F2; backdrop-filter:blur(12px);
}
.vC .toprow{display:flex; align-items:center; justify-content:space-between; margin-bottom:12px}
.vC .wordmark{font-family:'Calistoga',serif; font-size:20px; letter-spacing:.01em; color:var(--plum)}
.vC .back{
  width:38px; height:38px; border-radius:999px; border:1px solid var(--line); background:#fff;
  display:grid; place-items:center; cursor:pointer;
}
.vC .rail{height:3px; border-radius:999px; background:var(--line); overflow:hidden}
.vC .rail i{display:block; height:100%; width:40%; background:var(--terra); border-radius:999px}
.vC .railtxt{margin-top:8px; font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-2)}
.vC .step{padding:26px 20px 34px}
.vC .q{
  margin:0 0 6px; font-family:'Calistoga',serif; font-size:31px; line-height:1.14; color:var(--plum);
}
.vC .qsub{margin:0 0 20px; font-size:14px; color:var(--ink-2); line-height:1.55}
.vC .opts{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.vC .opt{
  min-height:88px; border-radius:16px; border:1px solid var(--line); background:#fff;
  padding:14px; display:flex; flex-direction:column; justify-content:flex-end; gap:6px;
  cursor:pointer; text-align:left; font:inherit; color:inherit; transition:border-color .18s ease, box-shadow .18s ease, background .18s ease;
}
.vC .opt:hover{border-color:#D8C6BA}
.vC .opt[aria-pressed="true"]{border-color:var(--terra); background:var(--terra-soft); box-shadow:0 0 0 1px var(--terra)}
.vC .opt b{font-size:15px; font-weight:600}
.vC .opt span{font-size:12px; color:var(--ink-2); line-height:1.35}
.vC .opt svg{width:22px; height:22px; color:var(--terra)}
.vC .chips{display:flex; flex-wrap:wrap; gap:9px}
.vC .chip{
  min-height:44px; padding:0 16px; border-radius:999px; border:1px solid var(--line); background:#fff;
  display:inline-flex; align-items:center; font:inherit; font-size:14px; cursor:pointer;
  transition:border-color .18s ease, background .18s ease;
}
.vC .chip[aria-pressed="true"]{border-color:var(--terra); background:var(--terra-soft); color:#8A3E1C; font-weight:600}
.vC .fold{margin-top:30px; padding-top:26px; border-top:1px dashed var(--line)}
.vC .foldtag{
  font-size:10.5px; letter-spacing:.16em; text-transform:uppercase; color:#A8998F; margin-bottom:14px;
}
.vC .preview{
  border-radius:20px; overflow:hidden; background:#140F13; color:#F3EBE6;
  box-shadow:0 24px 60px -26px #4A234066;
}
.vC .preview .art{height:200px; position:relative}
.vC .preview .art svg{width:100%; height:100%; display:block}
.vC .preview .body{padding:20px}
.vC .preview .nature{font-size:10.5px; letter-spacing:.16em; text-transform:uppercase; color:#C9A98F; margin-bottom:8px}
.vC .preview h3{margin:0 0 8px; font-family:'Calistoga',serif; font-size:24px; line-height:1.2}
.vC .preview p{margin:0; font-size:13.5px; color:#B6A69E; line-height:1.6}
.vC .money{
  margin-top:16px; border-radius:18px; border:1px solid var(--line); background:#fff; padding:18px;
}
.vC .money .line{display:flex; align-items:baseline; justify-content:space-between; padding:9px 0; font-size:14px}
.vC .money .line + .line{border-top:1px solid var(--line)}
.vC .money .line span{color:var(--ink-2)}
.vC .money .line b{font-size:16px}
.vC .money .line.tot b{font-family:'Calistoga',serif; font-size:22px; color:var(--plum)}
.vC .money .note{margin:12px 0 0; font-size:12.5px; color:var(--ink-2); line-height:1.55; display:flex; gap:8px}
.vC .money .note svg{flex:none; width:16px; height:16px; margin-top:2px; color:var(--terra)}
.vC .alt{
  margin-top:14px; padding:15px 16px; border-radius:14px; background:#F5EEE7;
  display:flex; align-items:center; justify-content:space-between; gap:12px;
}
.vC .alt b{display:block; font-size:13.5px}
.vC .alt span{display:block; font-size:12px; color:var(--ink-2)}
.vC .alt a{font-size:13px; font-weight:600; color:var(--terra); text-decoration:none; white-space:nowrap}
.vC .dock{
  position:sticky; bottom:0; z-index:30; padding:12px 20px calc(14px + env(safe-area-inset-bottom));
  background:#FDF8F3F2; backdrop-filter:blur(14px); border-top:1px solid var(--line);
}
.vC .dock a{
  min-height:54px; border-radius:999px; background:var(--plum); color:#FDF8F3;
  display:flex; align-items:center; justify-content:center; gap:9px; text-decoration:none;
  font-size:16px; font-weight:600;
}
.vC .dock .micro{margin:9px 0 0; font-size:11.5px; color:var(--ink-2); text-align:center}
@media (prefers-reduced-motion:reduce){ *{animation:none !important; transition:none !important} }
</style>

<div class="bench">
  <div class="stage">
    <div class="eyebrow" id="eyebrow"></div>
    <div class="phone"><div class="notch"></div><div class="screen" id="screen"></div></div>
    <div class="caption" id="caption"></div>

const cles = Object.keys(VARIANTS);
const screen = document.getElementById('screen');
const label = document.getElementById('label');
const eyebrow = document.getElementById('eyebrow');
const caption = document.getElementById('caption');
const notes = document.getElementById('notes');

function courante(){
  const v = new URLSearchParams(location.search).get('variant');
  return cles.includes(v) ? v : cles[0];
}

function rendre(){
  const k = courante();
  const v = VARIANTS[k];
  screen.scrollTop = 0;
  screen.innerHTML = v.html;
  label.innerHTML = `${k} — ${v.nom}<span>${v.sous}</span>`;
  eyebrow.innerHTML = `Ticket #7 · le site public · maquette <b>${k}</b> sur ${cles.length}`;
  caption.textContent = v.legende;
  notes.innerHTML = v.notes;
  brancher(k);
}

function aller(pas){
  const i = cles.indexOf(courante());
  const k = cles[(i + pas + cles.length) % cles.length];
  const u = new URL(location.href);
  u.searchParams.set('variant', k);
  history.replaceState(null, '', u);
  rendre();
}

/* Comportements internes aux maquettes — strictement décoratifs. */
function brancher(k){
  if (k === 'A'){
    const bar = document.getElementById('aBar');
    bar.style.transform = 'translateY(120%)';
    bar.style.transition = 'transform .28s ease';
    screen.onscroll = () => {
      bar.style.transform = screen.scrollTop > 240 ? 'translateY(0)' : 'translateY(120%)';
    };
  } else {
    screen.onscroll = null;
  }
  if (k === 'C'){
    screen.querySelectorAll('.chip').forEach(el => el.addEventListener('click', () => {
      screen.querySelectorAll('.chip').forEach(o => o.setAttribute('aria-pressed','false'));
      el.setAttribute('aria-pressed','true');
    }));
    screen.querySelectorAll('.opt').forEach(el => el.addEventListener('click', () => {
      screen.querySelectorAll('.opt').forEach(o => o.setAttribute('aria-pressed','false'));
      el.setAttribute('aria-pressed','true');
    }));
  }
}

document.getElementById('prev').addEventListener('click', () => aller(-1));
document.getElementById('next').addEventListener('click', () => aller(1));
document.addEventListener('keydown', e => {
  const t = e.target;
  if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;
  if (e.key === 'ArrowLeft') aller(-1);
  if (e.key === 'ArrowRight') aller(1);
});

rendre();
